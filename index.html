<!DOCTYPE html>
<html>
<head>
  <title>MOD Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</head>

<body>

<h1 class="title">MOD Games</h1>

<input type="text" id="search" placeholder="Search games...">

<div id="gamesGrid"></div>

<!-- Popup -->
<div id="popup" class="popup hidden">
  <div class="popup-content">

    <span id="closeBtn">✖</span>

    <img id="popupIcon" class="popup-icon">

    <h2 id="popupTitle"></h2>

    <img id="popupThumb" class="popup-thumb">

    <p id="popupVersion"></p>

    <p id="popupFeatures"></p>

    <p id="popupDownloads"></p>

    <a id="downloadBtn" target="_blank">
      <button>Download</button>
    </a>

    <a id="tutorialBtn" target="_blank">
      <button>How To Download</button>
    </a>

  </div>
</div>

</body>
</html>
